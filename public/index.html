<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎾 The Tennis Court Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="scroll">
        <header class="header">
            <div class="crest" aria-hidden="true">🎾</div>
            <h1>The Tennis Court Quest</h1>
            <p class="subtitle">Sound the horn when the royal courts fall free</p>
        </header>

        <form id="preferencesForm" class="form" novalidate>
            <section class="field">
                <label for="email">Thy Herald's Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="knight@camelot.co.uk"
                    autocomplete="email"
                    required
                >
            </section>

            <section class="field">
                <div class="field-head">
                    <label>Days of the Week</label>
                    <button type="button" class="select-all" data-group="day">All / None</button>
                </div>
                <div class="chips" role="group" aria-label="Days of the week">
                    <label class="chip"><input type="checkbox" name="day" value="Monday"><span>Mon</span></label>
                    <label class="chip"><input type="checkbox" name="day" value="Tuesday"><span>Tue</span></label>
                    <label class="chip"><input type="checkbox" name="day" value="Wednesday"><span>Wed</span></label>
                    <label class="chip"><input type="checkbox" name="day" value="Thursday"><span>Thu</span></label>
                    <label class="chip"><input type="checkbox" name="day" value="Friday"><span>Fri</span></label>
                    <label class="chip"><input type="checkbox" name="day" value="Saturday"><span>Sat</span></label>
                    <label class="chip"><input type="checkbox" name="day" value="Sunday"><span>Sun</span></label>
                </div>
            </section>

            <section class="field">
                <div class="field-head">
                    <label>Hours of Play</label>
                    <button type="button" class="select-all" data-group="time">All / None</button>
                </div>
                <div class="chips chips--time" role="group" aria-label="Hours of play">
                    <label class="chip"><input type="checkbox" name="time" value="07:00"><span>7am</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="08:00"><span>8am</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="09:00"><span>9am</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="10:00"><span>10am</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="11:00"><span>11am</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="12:00"><span>12pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="13:00"><span>1pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="14:00"><span>2pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="15:00"><span>3pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="16:00"><span>4pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="17:00"><span>5pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="18:00"><span>6pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="19:00"><span>7pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="20:00"><span>8pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="21:00"><span>9pm</span></label>
                    <label class="chip"><input type="checkbox" name="time" value="22:00"><span>10pm</span></label>
                </div>
            </section>

            <button type="submit" class="btn" id="submitBtn">
                <span class="btn-label">Start Quest</span>
                <span class="btn-emoji" aria-hidden="true">🎾</span>
            </button>

            <div id="statusMessage" class="status" role="status" aria-live="polite"></div>
        </form>

        <footer class="footer">Forged for those who await an open court.</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
